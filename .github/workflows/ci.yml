name: CI/CD

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ddcsa_coursework_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ddcsa_coursework_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ddcsa_coursework_test
      JWT_SECRET: ci_test_secret
      NODE_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Prepare test database
        run: npm run prisma:deploy

      - name: Run server tests
        run: npm test

      - name: Run API fuzzing
        env:
          FUZZ_ITERATIONS: 8
          FUZZ_SEED: 20260622
        run: npm run fuzz

  client:
    name: Client build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      VITE_API_URL: /api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run client tests
        run: npm test

      - name: Build client
        run: npm run build

  docker:
    name: Docker build and publish
    runs-on: ubuntu-latest
    needs:
      - server
      - client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose file
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ddcsa_coursework
          DATABASE_URL: postgresql://ci_user:ci_password@db:5432/ddcsa_coursework
          JWT_SECRET: ci_secret
          VITE_API_URL: /api
        run: docker compose config --quiet

      - name: Validate production Docker Compose file
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ddcsa_coursework
          DATABASE_URL: postgresql://ci_user:ci_password@db:5432/ddcsa_coursework
          JWT_SECRET: ci_secret
          SERVER_IMAGE: ghcr.io/kaprun17/ddcsa-coursework-server:latest
          CLIENT_IMAGE: ghcr.io/kaprun17/ddcsa-coursework-client:latest
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Prepare Docker image names
        shell: bash
        run: |
          IMAGE_OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "SERVER_IMAGE=ghcr.io/${IMAGE_OWNER}/ddcsa-coursework-server" >> "$GITHUB_ENV"
          echo "CLIENT_IMAGE=ghcr.io/${IMAGE_OWNER}/ddcsa-coursework-client" >> "$GITHUB_ENV"

      - name: Build server image
        run: |
          docker build \
            -t "$SERVER_IMAGE:${{ github.sha }}" \
            -t "$SERVER_IMAGE:latest" \
            ./server

      - name: Build client image
        env:
          CLIENT_API_URL: /api
        run: |
          docker build \
            --build-arg VITE_API_URL="${CLIENT_API_URL:-/api}" \
            -t "$CLIENT_IMAGE:${{ github.sha }}" \
            -t "$CLIENT_IMAGE:latest" \
            ./client

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish Docker images
        if: github.event_name != 'pull_request'
        run: |
          docker push "$SERVER_IMAGE:${{ github.sha }}"
          docker push "$SERVER_IMAGE:latest"
          docker push "$CLIENT_IMAGE:${{ github.sha }}"
          docker push "$CLIENT_IMAGE:latest"
