services:
  db:
    image: postgres:17-alpine
    container_name: ddcsa-coursework-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./server
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NODE_ENV: production
    command: npm run prisma:deploy
    restart: "no"

  server:
    build:
      context: ./server
    container_name: ddcsa-coursework-server
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      NODE_ENV: production
    ports:
      - "5000:5000"
    command: npm start

  seed:
    profiles: ["seed"]
    build:
      context: ./server
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NODE_ENV: development
    command: npm run prisma:seed
    restart: "no"

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: ddcsa-coursework-client
    depends_on:
      - server
    ports:
      - "5173:80"

volumes:
  postgres_data:
